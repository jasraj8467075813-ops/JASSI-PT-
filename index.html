<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rc Esports Official</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-trophy text-danger"></i>
                <span class="fw-bold">Rc Esports Official</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span id="saveStatus" class="text-success fw-semibold"><i class="fa-solid fa-circle-check me-1"></i> Data Saved</span>
                <button class="btn btn-sm btn-outline-danger" id="btnResetAll"><i class="fa-solid fa-rotate-right me-1"></i> Reset All Data</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row g-4">
            <!-- Controls, Match Data & Setup -->
            <div class="col-lg-6">
                
                <!-- Upload Template Card -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fa-solid fa-file-image me-2 text-danger"></i> 1. Upload Clean Template (Without Old Text)
                    </div>
                    <div class="card-body">
                        <input type="file" id="templateUploader" class="form-control" accept="image/*">
                    </div>
                </div>

                <!-- Match Calculator Settings Card -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fa-solid fa-sliders me-2 text-danger"></i> 2. Point Rules & Match Settings
                    </div>
                    <div class="card-body">
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fs-7 text-muted">TEAMS</label>
                                <input type="number" id="numTeams" class="form-control form-control-sm" min="1" max="12" value="12">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fs-7 text-muted">MATCHES (UP TO 6)</label>
                                <input type="number" id="numMatches" class="form-control form-control-sm" min="1" max="6" value="6">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fs-7 text-muted">PTS PER KILL</label>
                                <input type="number" id="killPointsRule" class="form-control form-control-sm" value="1" min="0" step="0.5">
                            </div>
                        </div>
                        <div>
                            <label class="form-label fs-7 text-muted d-block mb-1">PLACEMENT POINTS SYSTEM (RANK 1 → 12)</label>
                            <div class="pts-grid" id="placementRulesContainer"></div>
                        </div>
                    </div>
                </div>

                <!-- Team Scores & Matches Input Card -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-calculator me-2 text-danger"></i> 3. Team Entries & Match Scores</span>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" id="btnClear"><i class="fa-solid fa-eraser me-1"></i> Clear Matches</button>
                        </div>
                    </div>
                    <div class="card-body p-3">
                        <!-- Match Tabs -->
                        <ul class="nav nav-tabs mb-3" id="matchTabs" role="tablist">
                            <li class="nav-item">
                                <button class="nav-link active" data-tab="teams">Teams List</button>
                            </li>
                            <li class="nav-item"><button class="nav-link" data-tab="m1">Match 1</button></li>
                            <li class="nav-item"><button class="nav-link" data-tab="m2">Match 2</button></li>
                            <li class="nav-item"><button class="nav-link" data-tab="m3">Match 3</button></li>
                            <li class="nav-item"><button class="nav-link" data-tab="m4">Match 4</button></li>
                            <li class="nav-item"><button class="nav-link" data-tab="m5">Match 5</button></li>
                            <li class="nav-item"><button class="nav-link" data-tab="m6">Match 6</button></li>
                        </ul>

                        <div class="data-table-container">
                            <!-- Overall Teams Tab Content -->
                            <div id="tab-teams" class="tab-content-panel">
                                <table class="table table-dark-custom mb-0 align-middle">
                                    <thead>
                                        <tr>
                                            <th style="width: 8%" class="text-center">#</th>
                                            <th style="width: 38%">Team Name</th>
                                            <th style="width: 14%">Booyah</th>
                                            <th style="width: 13%">PP</th>
                                            <th style="width: 13%">KP</th>
                                            <th style="width: 14%">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody id="teamInputsContainer"></tbody>
                                </table>
                            </div>

                            <!-- Match 1-6 Dynamic Panels -->
                            <div id="matchPanelsContainer"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Canvas Preview and Export -->
            <div class="col-lg-6">
                <div class="card sticky-top" style="top: 1rem; z-index: 10">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-image me-2 text-danger"></i> Live Preview</span>
                        <button class="btn btn-custom btn-sm" id="btnDownload"><i class="fa-solid fa-download me-1"></i> Download PNG</button>
                    </div>
                    <div class="card-body d-flex justify-content-center align-items-center p-3">
                        <div class="canvas-container">
                            <canvas id="pointsCanvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalTitle">Confirm Action</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmModalBody">
                    Are you sure?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmModalActionBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
